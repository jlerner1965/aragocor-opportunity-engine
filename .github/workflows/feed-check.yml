# Runs the offline tests, then checks that every live feed still answers in the
# shape the parsers expect. Runs on every push to main, daily, and on demand
# (Actions → Feed check → Run workflow).
#
# A failure means a feed changed format or went down; GitHub emails the
# repository owner. The full report, with raw samples from each feed, is pushed
# to the `feed-check` branch (Vercel is told not to deploy that branch).
#
# Optional: add a repository secret SAM_API_KEY to include SAM.gov (one request
# a day). Without it, SAM.gov is skipped here and tested by the dashboard itself.

name: Feed check

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline tests
        run: npm test

      - name: Live feed check
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: node scripts/check-feeds.mjs --out "$RUNNER_TEMP/feed-check.json"

      - name: Publish report to the feed-check branch
        if: always()
        run: |
          set -e
          [ -f "$RUNNER_TEMP/feed-check.json" ] || exit 0
          cp "$RUNNER_TEMP/feed-check.json" "$RUNNER_TEMP/report.json"
          git config user.name "feed-check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan feed-check-report
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/report.json" feed-check.json
          printf 'Latest live feed check for %s. Generated by .github/workflows/feed-check.yml.\n' "$GITHUB_SHA" > README.md
          git add feed-check.json README.md
          git commit --quiet -m "Feed check $(date -u +%Y-%m-%dT%H:%MZ) for ${GITHUB_SHA::7}"
          git push --force --quiet origin HEAD:feed-check
